[flake8]
ignore=
    # Remove all docstring rules
    D,
    # Remove bad quotes
    Q000,
    # Missing docstring in public module
    WPS306,
    # Line break before binary operator
    F401,
    W503,
    # Found wrong keyword: pass
    WPS420,
    # Found `f` string
    WPS305,
    # Found using `@staticmethod`
    WPS602,
    WPS410,
    # Found nested class
    WPS431,
    # too many imports
    WPS235

exclude =
    .git,
    __pycache__,
    tests,
    vendors,
    __init__.py,
    .venv

max-local-variables = 15
max-methods = 10
max-line-length = 120

per-file-ignores =
  # There are multiple `assert`s in tests, we allow them:
  src/tests/*.py: S101
  */__init__.py: F401
  ./deps_generic_unifier_plugin/plugin.py: WPS221, WPS237

[mypy]
ignore_missing_imports = True
follow_imports = skip
follow_imports_for_stubs = False
cache_dir = /tmp/test_cache/.mypy_cache
strict_optional = False

[black]
line-length = 120
target-version = ['py39']
exclude = vendors

[isort]
profile = black
multi_line_output = 3
skip =
    vendors
    .venv

[coverage:run]
omit =
    tests/*
    */__init__.py
    /app/.venv/*
    /vendors/*
branch = True
data_file=/tmp/test_cache/.coverage

[ipdb]
context = 21
